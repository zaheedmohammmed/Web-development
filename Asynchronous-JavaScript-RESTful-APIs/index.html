<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Live weather dashboard powered by asynchronous JavaScript."><title>SkyCast | Live Weather</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><p class="eyebrow">Live conditions</p><h1>SkyCast</h1><p class="intro">Search any city for current weather, updated from a public forecast API.</p></header><form id="search-form"><label class="sr-only" for="city">City name</label><input id="city" type="search" placeholder="Search a city, e.g. Mumbai" required autocomplete="off"><button type="submit">Search</button></form><p id="status" class="status" aria-live="polite">Search for a city to see current conditions.</p><section id="weather" class="weather" aria-live="polite" hidden><div class="summary"><p id="place" class="place"></p><p id="condition" class="condition"></p><p id="temperature" class="temperature"></p><p id="updated" class="updated"></p></div><div class="metrics"><article><span>Humidity</span><strong id="humidity">—</strong></article><article><span>Wind speed</span><strong id="wind">—</strong></article><article><span>Feels like</span><strong id="apparent">—</strong></article><article><span>Cloud cover</span><strong id="cloud">—</strong></article></div></section></main><script src="script.js"></script></body></html>
