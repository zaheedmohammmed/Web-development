<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A client-side To-Do List application with persistent tasks and filters.">
  <title>TaskFlow | To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-app" aria-labelledby="app-title">
      <header class="app-header"><p class="eyebrow">Your daily focus</p><h1 id="app-title">TaskFlow</h1><p>Organize tasks, stay focused, and pick up where you left off.</p></header>
      <form id="task-form" class="task-form">
        <label class="sr-only" for="new-task">Add a new task</label>
        <input id="new-task" name="new-task" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required>
        <button type="submit">Add task</button>
      </form>
      <div class="toolbar"><div class="filters" role="group" aria-label="Filter tasks"><button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button><button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button><button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button></div><button id="clear-completed" class="clear-button" type="button">Clear completed</button></div>
      <p id="task-count" class="task-count" aria-live="polite">0 tasks remaining</p>
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>
      <p id="empty-state" class="empty-state">No tasks here yet. Add one above to get started.</p>
    </section>
  </main>
  <template id="task-template"><li class="task-item"><label class="task-check"><input class="toggle-task" type="checkbox"><span class="check-mark" aria-hidden="true"></span><span class="task-text"></span></label><div class="task-actions"><button class="icon-button edit-task" type="button" aria-label="Edit task">Edit</button><button class="icon-button delete-task" type="button" aria-label="Delete task">Delete</button></div></li></template>
  <script src="script.js"></script>
</body>
</html>
